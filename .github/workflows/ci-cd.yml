name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  DEPLOY_PATH: /opt/integra

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api

  build:
    name: Build ${{ matrix.target }} image
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web, migrate]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' \
            "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      - name: Upload stack files
        run: scp deploy/docker-compose.yml deploy/Caddyfile "vps:$DEPLOY_PATH/"

      - name: Pull images and restart stack
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh vps bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" "$GITHUB_ACTOR" "$REGISTRY_TOKEN" <<'EOF'
          set -euo pipefail
          deploy_path="$1" image_tag="$2" registry_user="$3" registry_token="$4"
          cd "$deploy_path"
          printf '%s' "$registry_token" | docker login ghcr.io -u "$registry_user" --password-stdin
          on_exit() {
            exit_code=$?
            [ "$exit_code" -ne 0 ] && docker compose logs --tail=100 migrate api
            docker logout ghcr.io >/dev/null
          }
          trap on_exit EXIT
          export IMAGE_TAG="$image_tag"
          docker compose pull
          docker compose up -d --remove-orphans
          echo "Waiting for the API health check..."
          for attempt in $(seq 1 30); do
            api_container="$(docker compose ps -q api)"
            status="$(docker inspect -f '{{.State.Health.Status}}' "$api_container" 2>/dev/null || true)"
            [ "$status" = healthy ] && break
            [ "$attempt" = 30 ] && { echo "API did not become healthy"; exit 1; }
            sleep 4
          done
          docker compose ps
          docker image prune -af --filter until=168h
          EOF
